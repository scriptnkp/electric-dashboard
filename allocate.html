<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>จัดสรรให้คลังต่างๆ</title>
    <link rel="stylesheet" href="style.css">
    <script src="data.js"></script>
</head>
<body>
    <div class="navbar">
        <a href="index.html" class="nav-btn">📊 หน้ากราฟ</a>
        <a href="demand.html" class="nav-btn">📋 ตารางความต้องการ</a>
        <a href="me2n.html" class="nav-btn">📦 วัสดุรอนำเข้า (ME2N)</a>
        <a href="plan1.html" class="nav-btn" style="background-color: #e84393; border-color: #e84393; font-weight:bold;">🛒 แผนซื้อ กฟฉ.1</a>
        <a href="allocate.html" class="nav-btn active-btn" style="background-color: #63cdda; border-color: #63cdda; color:#2c3e50; font-weight:bold;">🚚 จัดสรรให้คลังต่างๆ</a>
        <div style="margin-left: auto; align-self: center; font-size: 14px; color: #ecf0f1;">
            🕒 อัปเดตล่าสุด: <span id="lastUpdatedText" style="color: #f1c40f; font-weight: bold;"></span>
        </div>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="filter-section" style="margin-bottom:0; background:none; border:none; padding:0;">
                <div><label><b>🔍 ประเภท:</b></label> <select id="categoryFilter" onchange="applyFilters()"><option value="ALL">รวมทั้งหมด</option></select></div>
                <div><label><b>🏭 โรงงาน (คลังปลายทาง):</b></label> <select id="plantFilter" onchange="applyFilters()"><option value="ALL">รวมคลังทั้งหมด</option></select></div>
            </div>
            
            <!-- ป้ายชื่อมุมขวาบน -->
            <div class="header-badge bg-blue">🚚 จัดสรรให้คลังต่างๆ</div>
        </div>

        <div class="table-wrapper" style="margin-top: 20px; max-height: 650px;">
            <table>
                <thead style="background-color: #d2b4de;">
                    <tr>
                        <th style="background-color: #9b59b6; color:white; text-align:center;">ลำดับ</th>
                        <th style="background-color: #9b59b6; color:white;">เอกสารการจัดซื้อ (PO)</th>
                        <th style="background-color: #9b59b6; color:white;">โรงงาน (ปลายทาง)</th>
                        <th style="background-color: #9b59b6; color:white; text-align:center;">ที่เก็บสินค้า</th>
                        <th style="background-color: #9b59b6; color:white;">วัสดุ</th>
                        <th style="background-color: #9b59b6; color:white;">ข้อความสั้น</th>
                        <th style="background-color: #9b59b6; color:white; text-align:right">จำนวน</th>
                    </tr>
                </thead>
                <tbody id="detBody"></tbody>
            </table>
        </div>
    </div>

<script>
    function init() {
        document.getElementById('lastUpdatedText').innerText = typeof lastUpdated !== 'undefined' ? lastUpdated : 'กำลังอัปเดต...';
        
        if(typeof allocDetailsData === 'undefined') {
            document.getElementById('detBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">ไม่พบข้อมูล (รอ GitHub อัปเดต)</td></tr>';
            return;
        }

        const uniqueCat = [...new Set(allocDetailsData.map(i => i.Category))].sort();
        uniqueCat.forEach(c => document.getElementById('categoryFilter').appendChild(new Option(c, c)));
        allocPlants.forEach(v => document.getElementById('plantFilter').appendChild(new Option(v, v)));
        applyFilters();
    }

    function applyFilters() {
        if(typeof allocDetailsData === 'undefined') return;

        const cat = document.getElementById('categoryFilter').value;
        const plant = document.getElementById('plantFilter').value;
        
        let fd = allocDetailsData;
        if(cat !== 'ALL') fd = fd.filter(i => i.Category === cat);
        if(plant !== 'ALL') fd = fd.filter(i => i['โรงงาน'] === plant);

        let hDet = '', idx = 1;
        if(fd.length === 0) {
            hDet = '<tr><td colspan="7" style="text-align:center; padding:20px;">ไม่มีรายการที่ตรงกับเงื่อนไข</td></tr>';
        } else {
            fd.forEach(i => {
                let safeTxt = i['ข้อความส่วนหัว'] ? i['ข้อความส่วนหัว'].replace(/'/g, "\\'") : '';
                let poHtml = i['ข้อความส่วนหัว'] ? `<span title="${safeTxt}" style="border-bottom:1px dashed #7f8c8d; cursor:help;">${i['เอกสารการจัดซื้อ']}</span> <button onclick="copyTxt(this, '${safeTxt}')" class="copy-icon-btn">📋</button>` : i['เอกสารการจัดซื้อ'];
                
                hDet += `<tr style="background-color: #fdf2e9;">
                    <td style="text-align:center">${idx++}</td>
                    <td>${poHtml}</td>
                    <td>${i['โรงงาน']}</td>
                    <td style="text-align:center;">${i['ที่เก็บสินค้า']}</td>
                    <td><b>${i['วัสดุ']}</b></td>
                    <td>${i['ข้อความสั้น']}</td>
                    <td style="text-align:right; color:#d35400"><b>${i['ยังจะถูกส่งมอบ (ปริมาณ)'].toLocaleString()}</b></td>
                </tr>`;
            });
        }
        document.getElementById('detBody').innerHTML = hDet;
    }

    window.copyTxt = function(btn, txt) {
        navigator.clipboard.writeText(txt);
        let o = btn.innerHTML; btn.innerHTML = '✅'; setTimeout(() => btn.innerHTML = o, 1500);
    };
    window.onload = init;
</script>
</body>
</html>
