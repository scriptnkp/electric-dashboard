<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้ากราฟ (Dashboard)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="data.js"></script> <!-- ดึงข้อมูลจากไฟล์ data.js -->
</head>
<body>
    <div class="navbar">
        <a href="dashboard.html" class="nav-btn active-btn">📊 หน้ากราฟ (Dashboard)</a>
        <a href="demand.html" class="nav-btn">📋 ตารางความต้องการ</a>
        <a href="me2n.html" class="nav-btn">📦 วัสดุรอนำเข้า (ME2N)</a>
    </div>

    <div class="container">
        <div class="filter-section">
            <div><label><b>🔍 ประเภท:</b></label> <select id="categoryFilter" onchange="applyFilters()"><option value="ALL">รวมทั้งหมด</option></select></div>
            <div><label><b>⚖️ สถานะ:</b></label> <select id="balanceFilter" onchange="applyFilters()"><option value="ALL">ทั้งหมด</option><option value="SHORTAGE">🔴 ของขาด</option><option value="SURPLUS">🟢 ของเหลือ</option></select></div>
        </div>

        <div style="display:flex; gap:20px;">
            <div style="flex:1; border:1px solid #ddd; padding:15px; border-radius:8px;">
                <h3 style="text-align:center;">จำนวนงาน (WBS) แยกตามงบ</h3>
                <div style="height:300px;"><canvas id="pieChart"></canvas></div>
            </div>
            <div style="flex:2; border:1px solid #ddd; padding:15px; border-radius:8px;">
                <h3 style="text-align:center;">ยอดขาด/เกิน (Balance)</h3>
                <div style="height:300px;"><canvas id="balanceChart"></canvas></div>
            </div>
        </div>
    </div>

<script>
    let balanceChart = null;
    function init() {
        const uniqueCat = [...new Set(mainData.map(i => i.Category))].sort();
        uniqueCat.forEach(c => document.getElementById('categoryFilter').appendChild(new Option(c, c)));
        
        new Chart(document.getElementById('pieChart'), {
            type: 'pie', 
            data: { labels: pieRawData.map(i=>i.Project_Group), datasets: [{ data: pieRawData.map(i=>i.WBS_Count), backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'] }] },
            options: { maintainAspectRatio: false }
        });
        applyFilters();
    }

    function applyFilters() {
        const cat = document.getElementById('categoryFilter').value;
        const bal = document.getElementById('balanceFilter').value;
        let fd = mainData;
        if(cat !== 'ALL') fd = fd.filter(i => i.Category === cat);
        if(bal === 'SHORTAGE') fd = fd.filter(i => i.Balance < 0);
        else if(bal === 'SURPLUS') fd = fd.filter(i => i.Balance >= 0);
        
        if (balanceChart) balanceChart.destroy();
        balanceChart = new Chart(document.getElementById('balanceChart'), {
            type: 'bar',
            data: { labels: fd.map(i=>i['วัสดุ']), datasets: [{ label: 'ยอดขาด/เกิน', data: fd.map(i=>i.Balance), backgroundColor: fd.map(i=>i.Balance>=0?'#28a745':'#dc3545') }] },
            options: { maintainAspectRatio: false, plugins: { tooltip: { callbacks: { beforeTitle: ctx => fd[ctx[0].dataIndex]['คำอธิบายวัสดุ'] } } } }
        });
    }
    window.onload = init;
</script>
</body>
</html>
