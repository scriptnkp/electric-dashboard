<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้ากราฟ (Dashboard)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="data.js"></script>
</head>
<body>
    <div class="navbar">
        <a href="index.html" class="nav-btn active-btn">📊 หน้ากราฟ (Dashboard)</a>
        <a href="demand.html" class="nav-btn">📋 ตารางความต้องการ</a>
        <a href="me2n.html" class="nav-btn">📦 วัสดุรอนำเข้า (ME2N)</a>
        <a href="plan1.html" class="nav-btn" style="background-color: #e84393; border-color: #e84393;">🛒 แผนซื้อ กฟฉ.1</a>
        <div style="margin-left: auto; align-self: center; font-size: 14px; color: #ecf0f1;">
            🕒 อัปเดตข้อมูลล่าสุด: <span id="lastUpdatedText" style="color: #f1c40f; font-weight: bold;"></span>
        </div>
    </div>

    <div class="container">
        <div class="filter-section">
            <div><label><b>🔍 ประเภท:</b></label> <select id="categoryFilter" onchange="applyFilters()"><option value="ALL">รวมทั้งหมด</option></select></div>
            <div><label><b>⚖️ สถานะ:</b></label> <select id="balanceFilter" onchange="applyFilters()"><option value="ALL">ทั้งหมด</option><option value="SHORTAGE">🔴 ของขาด</option><option value="SURPLUS">🟢 ของเหลือ</option></select></div>
        </div>
        <div style="display:flex; gap:20px; margin-bottom: 20px; flex-wrap: wrap;">
            <div style="flex:1; min-width: 350px; border:1px solid #ddd; padding:15px; border-radius:8px;">
                <h3 style="text-align:center; margin-top:0;">📌 จำนวนงาน (WBS) แยกตามงบ</h3>
                <div style="height:350px;"><canvas id="pieChart"></canvas></div>
            </div>
            <div style="flex:2; min-width: 500px; border:1px solid #ddd; padding:15px; border-radius:8px;">
                <h3 style="text-align:center; margin-top:0;">📊 ความต้องการรวม vs สต๊อกคงคลัง</h3>
                <div style="height:350px;"><canvas id="barChart"></canvas></div>
            </div>
        </div>
        <div style="border:1px solid #ddd; padding:15px; border-radius:8px;">
            <h3 style="text-align:center; margin-top:0;">📉 ยอดขาด/เกิน (Balance)</h3>
            <div style="height:350px;"><canvas id="balanceChart"></canvas></div>
        </div>
    </div>

<script>
    let balanceChart=null, barChart=null;
    function init() {
        document.getElementById('lastUpdatedText').innerText = typeof lastUpdated !== 'undefined' ? lastUpdated : 'กำลังอัปเดต...';
        const uniqueCat = [...new Set(mainData.map(i => i.Category))].sort();
        uniqueCat.forEach(c => document.getElementById('categoryFilter').appendChild(new Option(c, c)));
        new Chart(document.getElementById('pieChart'), {
            type: 'pie', data: { labels: pieRawData.map(i=>i.Project_Group), datasets: [{ data: pieRawData.map(i=>i.WBS_Count), backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#8AC926'] }] },
            options: { maintainAspectRatio: false }
        }); applyFilters();
    }
    function applyFilters() {
        const cat = document.getElementById('categoryFilter').value, bal = document.getElementById('balanceFilter').value;
        let fd = mainData;
        if(cat !== 'ALL') fd = fd.filter(i => i.Category === cat);
        if(bal === 'SHORTAGE') fd = fd.filter(i => i.Balance < 0); else if(bal === 'SURPLUS') fd = fd.filter(i => i.Balance >= 0);
        if (barChart) barChart.destroy();
        barChart = new Chart(document.getElementById('barChart'), { type: 'bar', data: { labels: fd.map(i=>i['วัสดุ']), datasets: [ { label: 'รวมความต้องการ', data: fd.map(i=>i.Total_Demand), backgroundColor: '#FF6384' }, { label: 'สต๊อกคงคลัง D060', data: fd.map(i=>i.Stock), backgroundColor: '#36A2EB' } ] }, options: { maintainAspectRatio: false, plugins: { tooltip: { callbacks: { beforeTitle: ctx => fd[ctx[0].dataIndex]['คำอธิบายวัสดุ'] } } } } });
        if (balanceChart) balanceChart.destroy();
        balanceChart = new Chart(document.getElementById('balanceChart'), { type: 'bar', data: { labels: fd.map(i=>i['วัสดุ']), datasets: [{ label: 'ยอดขาด/เกิน', data: fd.map(i=>i.Balance), backgroundColor: fd.map(i=>i.Balance>=0?'#28a745':'#dc3545') }] }, options: { maintainAspectRatio: false, plugins: { tooltip: { callbacks: { beforeTitle: ctx => fd[ctx[0].dataIndex]['คำอธิบายวัสดุ'] } } } } });
    }
    window.onload = init;
</script>
</body>
</html>
