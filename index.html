<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้ากราฟ (Dashboard)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="data.js"></script>
</head>
<body>
    <div class="navbar">
        <a href="index.html" class="nav-btn active-btn">📊 หน้ากราฟ</a>
        <a href="demand.html" class="nav-btn">📋 ตารางความต้องการ</a>
        <a href="me2n.html" class="nav-btn">📦 วัสดุรอนำเข้า (ME2N)</a>
        <a href="plan1.html" class="nav-btn" style="background-color: #e84393; border-color: #e84393; font-weight:bold;">🛒 แผนซื้อ กฟฉ.1</a>
        <a href="allocate.html" class="nav-btn" style="background-color: #63cdda; border-color: #63cdda; color:#2c3e50; font-weight:bold;">🚚 จัดสรรให้คลังต่างๆ</a>
        <a href="budget.html" class="nav-btn" style="background-color: #f39c12; border-color: #f39c12; color:white; font-weight:bold;">💰 งบเงิน</a>
        <a href="purchase.html" class="nav-btn active-btn" style="background-color: #8e44ad; border-color: #8e44ad; color:white; font-weight:bold;">🛒 รายการจัดซื้อ</a>
        <div style="margin-left: auto; align-self: center; font-size: 14px; color: #ecf0f1;">
            🕒 อัปเดตล่าสุด: <span id="lastUpdatedText" style="color: #f1c40f; font-weight: bold;"></span>
        </div>
    </div>

    <div class="container">
        <div class="filter-section">
            <div><label><b>🔍 ประเภท:</b></label> <select id="categoryFilter" onchange="applyFilters()"><option value="ALL">รวมทั้งหมด</option></select></div>
            <div><label><b>⚖️ สถานะ:</b></label> <select id="balanceFilter" onchange="applyFilters()"><option value="ALL">ทั้งหมด</option><option value="SHORTAGE">🔴 ของขาด</option><option value="SURPLUS">🟢 ของเหลือ</option></select></div>
        </div>
        
        <div style="display:flex; gap:20px; margin-bottom: 20px; flex-wrap: wrap;">
            <div style="flex:1; min-width: 350px; border:1px solid #ddd; padding:15px; border-radius:8px; display: flex; flex-direction: column; align-items: center;">
                <h3 style="text-align:center; margin-top:0; margin-bottom: 5px;">📌 จำนวนงานแยกตามงบ</h3>
                <span style="font-size:12px; color:#7f8c8d;">(คลิกที่สีในกราฟเพื่อกรองดูเฉพาะงบ)</span>
                <button id="resetPieBtn" class="reset-btn" onclick="currentSelectedGroup=null; applyFilters();">❌ ล้างการเลือกงบ</button>
                <div style="height:300px; width:100%; margin-top: 10px;"><canvas id="pieChart"></canvas></div>
            </div>
            
            <div style="flex:2; min-width: 500px; border:1px solid #ddd; padding:15px; border-radius:8px;">
                <h3 id="barTitle" style="text-align:center; margin-top:0;">📊 ความต้องการรวม vs สต๊อกคงคลัง</h3>
                <div style="height:330px;"><canvas id="barChart"></canvas></div>
            </div>
        </div>
        
        <div style="border:1px solid #ddd; padding:15px; border-radius:8px;">
            <h3 id="balTitle" style="text-align:center; margin-top:0;">📉 ยอดขาด/เกิน (Balance)</h3>
            <div style="height:350px;"><canvas id="balanceChart"></canvas></div>
        </div>
    </div>

<script>
    let balanceChart = null, barChart = null, pieChartObj = null;
    let currentSelectedGroup = null; // ตัวแปรเก็บว่าคลิกเลือกงบไหนอยู่

    function init() {
        document.getElementById('lastUpdatedText').innerText = typeof lastUpdated !== 'undefined' ? lastUpdated : 'กำลังอัปเดต...';
        const uniqueCat = [...new Set(mainData.map(i => i.Category))].sort();
        uniqueCat.forEach(c => document.getElementById('categoryFilter').appendChild(new Option(c, c)));
        
        pieChartObj = new Chart(document.getElementById('pieChart'), {
            type: 'pie', 
            data: { 
                labels: pieRawData.map(i=>i.Project_Group), 
                datasets: [{ 
                    data: pieRawData.map(i=>i.WBS_Count), 
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#8AC926', '#e84393', '#00b894'] 
                }] 
            },
            options: { 
                maintainAspectRatio: false,
                // เพิ่มคำสั่งดักจับการคลิกที่กราฟวงกลม
                onClick: (event, elements) => {
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        const label = pieChartObj.data.labels[index];
                        // ถ้าคลิกอันเดิมซ้ำ ให้ยกเลิกการเลือก
                        if (currentSelectedGroup === label) {
                            currentSelectedGroup = null;
                        } else {
                            currentSelectedGroup = label;
                        }
                        applyFilters();
                    } else {
                        // ถ้าคลิกพื้นที่ว่างในกราฟ ให้ยกเลิกการเลือก
                        currentSelectedGroup = null;
                        applyFilters();
                    }
                }
            }
        }); 
        
        applyFilters();
    }

    function applyFilters() {
        const cat = document.getElementById('categoryFilter').value;
        const bal = document.getElementById('balanceFilter').value;
        let fd = mainData;
        
        // 1. กรองประเภทและสถานะหลัก
        if(cat !== 'ALL') fd = fd.filter(i => i.Category === cat);

        // 2. คำนวณ Demand และ Balance ใหม่ตาม "งบ" ที่ถูกคลิก
        let chartData = fd.map(i => {
            let demand = currentSelectedGroup ? (i[currentSelectedGroup] || 0) : i.Total_Demand;
            let balance = i.Stock - demand;
            return { ...i, Chart_Demand: demand, Chart_Balance: balance };
        });

        // 3. ถ้ามีการคลิกเลือกงบ ให้ซ่อนอุปกรณ์ที่ไม่ได้ใช้อยู่ในงบนั้น (ยอด = 0)
        if (currentSelectedGroup) {
            chartData = chartData.filter(i => i.Chart_Demand > 0);
            document.getElementById('resetPieBtn').style.display = 'inline-block';
        } else {
            document.getElementById('resetPieBtn').style.display = 'none';
        }

        // 4. กรองยอดขาดเกิน (หลังจากคำนวณยอดของงบนั้นๆ แล้ว)
        if(bal === 'SHORTAGE') chartData = chartData.filter(i => i.Chart_Balance < 0);
        else if(bal === 'SURPLUS') chartData = chartData.filter(i => i.Chart_Balance >= 0);

        // เปลี่ยนชื่อหัวข้อกราฟให้ตรงกับที่เลือก
        document.getElementById('barTitle').innerHTML = currentSelectedGroup ? `📊 ความต้องการ (<span style="color:#3498db">งบ: ${currentSelectedGroup}</span>) vs สต๊อกคงคลัง` : `📊 ความต้องการรวม vs สต๊อกคงคลัง`;
        document.getElementById('balTitle').innerHTML = currentSelectedGroup ? `📉 ยอดขาด/เกิน (<span style="color:#3498db">งบ: ${currentSelectedGroup}</span>)` : `📉 ยอดขาด/เกิน (Balance รวม)`;

        // วาดกราฟแท่งที่ 1 (Demand vs Stock)
        if (barChart) barChart.destroy();
        barChart = new Chart(document.getElementById('barChart'), { 
            type: 'bar', 
            data: { 
                labels: chartData.map(i=>i['วัสดุ']), 
                datasets: [ 
                    { label: currentSelectedGroup ? `ต้องการ (${currentSelectedGroup})` : 'รวมความต้องการ', data: chartData.map(i=>i.Chart_Demand), backgroundColor: '#FF6384' }, 
                    { label: 'สต๊อกคงคลัง D060', data: chartData.map(i=>i.Stock), backgroundColor: '#36A2EB' } 
                ] 
            }, 
            options: { maintainAspectRatio: false, plugins: { tooltip: { callbacks: { beforeTitle: ctx => chartData[ctx[0].dataIndex]['คำอธิบายวัสดุ'] } } } } 
        });

        // วาดกราฟแท่งที่ 2 (Balance)
        if (balanceChart) balanceChart.destroy();
        balanceChart = new Chart(document.getElementById('balanceChart'), { 
            type: 'bar', 
            data: { 
                labels: chartData.map(i=>i['วัสดุ']), 
                datasets: [{ label: 'ยอดขาด/เกิน', data: chartData.map(i=>i.Chart_Balance), backgroundColor: chartData.map(i=>i.Chart_Balance>=0?'#28a745':'#dc3545') }] 
            }, 
            options: { maintainAspectRatio: false, plugins: { tooltip: { callbacks: { beforeTitle: ctx => chartData[ctx[0].dataIndex]['คำอธิบายวัสดุ'] } } } } 
        });
    }

    window.onload = init;
</script>
</body>
</html>
